name: Build & Push Docker image

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build JAR
        run: mvn -B -DskipTests package

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=pr-${{ github.event.number }}" >> $GITHUB_ENV
          fi

      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/task-tracker-app:${{ env.IMAGE_TAG }} .

      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/task-tracker-app:${{ env.IMAGE_TAG }}
